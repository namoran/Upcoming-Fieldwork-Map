<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florida Fieldwork Notifications</title>
<meta name="description" content="Map of recent field work notifications filed with the Florida Department of Environmental Protection.">
<link rel="stylesheet" href="leaflet.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b5f8a'/%3E%3C/svg%3E">
<style>
  :root { --ink:#161a1d; --muted:#5b6770; --line:#dfe5ea; --bg:#f7f9fa; --card:#fff; --accent:#0b5f8a; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); display:flex; flex-direction:column; }

  header { flex:0 0 auto; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 22px; }
  header h1 { font-size:1.15rem; margin:0; letter-spacing:-.01em; }
  header .where { color:var(--muted); font-size:.85rem; }
  header .stats { margin-left:auto; display:flex; gap:18px; font-size:.85rem; color:var(--muted); }
  header .stats b { color:var(--ink); font-size:1rem; font-variant-numeric:tabular-nums; }

  main { display:flex; flex:1; min-height:0; }
  aside { width:272px; flex:0 0 auto; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #q { margin:12px; padding:8px 10px; font:inherit; border:1px solid var(--line); border-radius:7px; }
  #q:focus { outline:2px solid #bcd9e8; border-color:var(--accent); }
  aside h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:8px 12px 6px; }
  #counties { list-style:none; margin:0; padding:0 0 12px; overflow-y:auto; flex:1; }
  #counties button { all:unset; box-sizing:border-box; display:flex; align-items:center; gap:8px; width:100%; padding:5px 12px; cursor:pointer; font-size:.88rem; }
  #counties button:hover, #counties button.active { background:#eef6fb; }
  #counties button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  #counties .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #counties .n { color:var(--muted); font-variant-numeric:tabular-nums; font-size:.8rem; }
  #counties .bar { height:5px; border-radius:3px; background:var(--accent); opacity:.45; }

  #map { flex:1; min-width:0; }
  .leaflet-popup-content { margin:12px 14px; font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .leaflet-popup-content .fac { font-weight:650; font-size:14px; margin-bottom:1px; }
  .leaflet-popup-content .addr { color:#5b6770; margin-bottom:8px; }
  .leaflet-popup-content ul { margin:0; padding:0; list-style:none; }
  .leaflet-popup-content li { padding:5px 0; border-top:1px solid #e8edf1; }
  .leaflet-popup-content li:first-child { border-top:0; }
  .leaflet-popup-content .d { color:#0b5f8a; font-variant-numeric:tabular-nums; font-weight:600; }
  .leaflet-popup-content .s { display:block; color:#3d4a54; font-size:12.5px; }
  .leaflet-popup-content a { color:#0b5f8a; }

  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--muted); z-index:500; }
  .msg.error { color:#8a1c1c; }
  .credit { padding:9px 12px; border-top:1px solid var(--line); font-size:.75rem; color:var(--muted); line-height:1.4; }
  .credit a { color:var(--accent); }
  .hidden { display:none; }

  @media (max-width:720px) {
    main { flex-direction:column; }
    aside { width:100%; border-right:0; border-bottom:1px solid var(--line); max-height:32vh; flex:0 0 auto; }
    #map { flex:1; min-height:48vh; }
    header .stats { margin-left:0; }
    .credit { padding:6px 12px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Florida Fieldwork Notifications</h1>
    <div class="where">Field work notices filed with FDEP &middot; <span id="window">loading…</span></div>
  </div>
  <div class="stats">
    <span><b id="n-fac">–</b> facilities</span>
    <span><b id="n-doc">–</b> notices</span>
    <span><b id="n-county">–</b> counties</span>
  </div>
</header>

<main>
  <aside>
    <input id="q" type="search" placeholder="Search facility, city, county…" autocomplete="off" aria-label="Search facilities">
    <h2>Notices by county</h2>
    <ul id="counties"></ul>
    <div class="credit">
      Data from <a href="https://prodenv.dep.state.fl.us/DepNexus/public/electronic-documents" target="_blank" rel="noopener">FDEP DepNexus</a>.
      By Nicholas Moran PG at <a href="https://moran.rocks" target="_blank" rel="noopener">Moran.Rocks</a>.
    </div>
  </aside>
  <div id="map"><div class="msg" id="msg">Loading map…</div></div>
</main>

<script src="leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
