name: Update fieldwork data

# FDEP's search is a form POST backed by a session cookie, and the CSV export
# sends no CORS headers, so a browser cannot call it. This workflow runs the
# fetcher on a schedule and commits the result, which the static map reads.
#
# Daily, because notices are filed continuously and the map looks stale quickly.
# Run it by hand from the Actions tab to widen the window.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days of filed notices to include'
        required: false
        default: '14'

permissions:
  contents: write

concurrency:
  group: fieldwork-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch from FDEP
        run: python fetch_fieldwork.py --days-back '${{ inputs.days_back || '14' }}'

      - name: Check the data file
        run: python tests/check_data.py

      - name: Commit if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/fieldwork.json
          if git diff --cached --quiet; then
            echo "no new notices"
          else
            git commit -m "Update fieldwork data for $(date -u +%Y-%m-%d)"
            git push
          fi
